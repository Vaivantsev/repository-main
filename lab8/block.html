<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 20px;
        }

        h2 {
        }

        .header {
            background: #db70ab;
            padding: 25px;
            text-align: left;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .container {
            overflow: auto;
        }

        .menu {
            background: #f460e8;
            padding: 20px;
            float: left;
            width: 25%;
            border-radius: 15px;
        }

        .content {
            background: #de8787;
            padding: 20px;
            float: right;
            width: 70%;
            border-radius: 15px;
        }

        .footer {
            background: #bc8f8f;
            padding: 15px;
            clear: both;
            text-align: right;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <h2>Блочная верстка</h2>
    <div class="header">Заголовок сайта</div>
    <div class="container">
        <div class="menu">Навигация<br>Раздел 1<br>Раздел 2<br>Раздел 3</div>
        <div class="content">Текст контента<br>Блоки с float</div>
    </div>
    <div class="footer">Копирайт</div>
</body>

</html>
