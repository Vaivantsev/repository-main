<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #000000;
        }

        table {
            width: 100%;
            border: 3px solid #02008b;
        }

        td {
            border: 1px solid #6d5ccd;
            padding: 15px;
        }

        .header {
            background: #7ab4ff;
            font-size: 24px;
            text-align: center;
        }

        .left {
            background: #2c5ba1;
            width: 30%;
            vertical-align: top;
        }

        .right {
            background: #87cefa;
            width: 70%;
        }

        .footer {
            background: #475ba1;
            text-align: center;
        }
    </style>
</head>

<body>
    <h2>Табличная верстка</h2>
    <table>
        <tr>
            <td colspan="2" class="header">Мой сайт</td>
        </tr>
        <tr>
            <td class="left">Меню<br>• Главная<br>• О нас<br>• Контакты</td>
            <td class="right">Контент<br>Привет, это таблица!</td>
        </tr>
        <tr>
            <td colspan="2" class="footer">Подвал 2025</td>
        </tr>
    </table>
</body>

</html>
