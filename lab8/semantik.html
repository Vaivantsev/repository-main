<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            padding: 20px;
        }

        h2 {
        }

        header {
            background: #708090;
            padding: 30px;
            text-align: center;
            border-bottom: 5px solid #2f4f4f;
        }

        nav {
            background: #b0c4de;
            padding: 15px;
            margin: 10px 0;
            display: inline-block;
            width: 20%;
        }

        main {
            background: #d3d3d3;
            padding: 15px;
            margin: 10px 0;
            display: inline-block;
            width: 75%;
            float: right;
        }

        article {
            background: #c0c0c0;
            padding: 10px;
            margin: 10px 0;
        }

        footer {
            background: #2f4f4f;
            color: white;
            padding: 20px;
            clear: both;
            text-align: center;
        }
    </style>
</head>

<body>
    <h2>Семантическая верстка</h2>
    <header>header - шапка</header>
    <nav>nav - меню</nav>
    <main>
        main - основной контент
        <article>article - статья 1</article>
        <article>article - статья 2</article>
    </main>
    <footer>footer - подвал</footer>
</body>

</html>
