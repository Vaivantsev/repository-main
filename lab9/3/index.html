<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Задание 9</title>
    <style>
        body {
            margin: 30px;
            background: white;
        }
        .container {
            position: relative;
            width: 400px;
            height: 400px;
            border: 2px solid black;
            overflow: hidden;
        }
        .square {
            position: absolute;
            width: 50px;
            height: 50px;
            background: red;
            animation: move 4s infinite linear;
        }
        @keyframes move {
            0% { left: 0; top: 0; background: red; }
            10% { left: 350px; top: 0; background: blue; }
            20% { left: 350px; top: 350px; background: green; }
            30% { left: 0; top: 350px; background: yellow; }
            40% { left: 0; top: 0; background: red; }
            50% { left: 350px; top: 350px; background: purple; }
            60% { left: 0; top: 350px; background: orange; }
            70% { left: 350px; top: 0; background: pink; }
            80% { left: 0; top: 0; background: red; }
            90% { left: 350px; top: 350px; background: brown; }
            100% { left: 0; top: 0; background: red; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="square"></div>
    </div>
</body>
</html>
