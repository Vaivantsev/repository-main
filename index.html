<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/html4/frameset.dtd">
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Лабораторная работа 5: Фреймы</title>
</head>
<frameset rows="20%, 80%" frameborder="1" border="2">
    <!-- Верхний фрейм (Заголовок) -->
    <frame src="header.html" name="header_frame" noresize scrolling="no" title="Заголовок">

        <!-- Нижняя часть, разделенная на два столбца -->
        <frameset cols="30%, 70%">
            <!-- Левый нижний фрейм (Меню) -->
            <frame src="menu.html" name="menu_frame" title="Меню">
                <!-- Правый нижний фрейм (Информация) - ОСНОВНОЙ -->
                <frame src="content.html" name="info_frame" title="Информационный фрейм">
        </frameset>

        <!-- Для браузеров, которые не поддерживают фреймы -->
        <noframes>

            <body>
                <p>Ваш браузер не поддерживает фреймы.</p>
            </body>
        </noframes>
</frameset>

</html>
